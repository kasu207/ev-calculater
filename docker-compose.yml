services:
  ev-calculator:
    build: .
    image: ev-calculator:latest
    container_name: ev-calculator

    # Erreichbar auf Port 7000 des Hosts, intern lauscht der Server auf 3000.
    # Ohne BIND_ADDR wird keine Host-IP gesetzt, damit Docker wie üblich IPv4
    # und IPv6 bindet - sonst schlägt "curl localhost:7000" auf Hosts fehl,
    # die localhost zuerst nach ::1 auflösen.
    # Hinter einem Reverse Proxy gezielt nur lokal binden:
    #   BIND_ADDR=127.0.0.1 docker compose up -d
    ports:
      - "${BIND_ADDR:+${BIND_ADDR}:}7000:3000"

    restart: unless-stopped

    # Kein `init: true`. Es wuerde /sbin/docker-init in den Container mounten,
    # was auf gehaerteten Hosts an "operation not permitted" scheitern kann.
    # Gebraucht wird es hier ohnehin nicht: der Server behandelt SIGTERM und
    # SIGINT selbst (siehe server/server.js) und startet keine Kindprozesse,
    # die abgeraeumt werden muessten.

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      TZ: Europe/Berlin

      # --- Tagesaktuelle Marktdaten (standardmäßig aus) ---------------------
      # Ohne diese Werte geht keine einzige Anfrage nach außen und der Rechner
      # arbeitet ausschließlich mit den eingetragenen Zahlen.
      #
      # Kraftstoffpreise: kostenloser Schlüssel unter
      # https://creativecommons.tankerkoenig.de/ - die Quelle erlaubt eine
      # Abfrage je fünf Minuten, der Server hält das von sich aus ein.
      TANKERKOENIG_API_KEY: "${TANKERKOENIG_API_KEY:-}"
      # Region des Betreibers. Nutzer können im Formular eine eigene
      # Postleitzahl eintragen; nur dann verlässt eine Ortsangabe den Server.
      MARKET_POSTAL_CODE: "${MARKET_POSTAL_CODE:-}"
      MARKET_RADIUS_KM: "${MARKET_RADIUS_KM:-10}"
      # Börsenstrompreis (Energy-Charts, Fraunhofer ISE): "on" schaltet ihn ein.
      MARKET_POWER: "${MARKET_POWER:-off}"

      # --- Fahrzeugdaten aus externer Quelle (optional) ---------------------
      # Datei als Volume einhängen und hier eintragen, dann lässt sich der
      # Datenstand ohne neues Abbild wechseln. VEHICLES_URL nimmt stattdessen
      # einen nächtlichen Vollabzug entgegen, wie ihn Anbieter mit
      # Lizenzvertrag bereitstellen.
      VEHICLES_FILE: "${VEHICLES_FILE:-}"
      VEHICLES_URL: "${VEHICLES_URL:-}"

    # Für VEHICLES_FILE: die Datei aus dem Hostverzeichnis einhängen.
    # volumes:
    #   - ./daten/vehicles.json:/app/daten/vehicles.json:ro

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # Zusatzhärtung (read_only, cap_drop, no-new-privileges) ist bewusst nicht
    # aktiv: sie hat auf einem gehärteten Ubuntu-Host den Containerstart
    # verhindert. Für den Betrieb wird sie nicht gebraucht - die Anwendung
    # läuft als unprivilegierter Nutzer, schreibt nichts und hält keine Daten.
    # Wer sie einschalten will, prüft die Optionen einzeln, siehe README.

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
