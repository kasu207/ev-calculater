services:
  ev-calculator:
    build: .
    image: ev-calculator:latest
    container_name: ev-calculator

    # Erreichbar auf Port 7000 des Hosts, intern lauscht der Server auf 3000.
    # Ohne BIND_ADDR wird keine Host-IP gesetzt, damit Docker wie üblich IPv4
    # und IPv6 bindet - sonst schlägt "curl localhost:7000" auf Hosts fehl,
    # die localhost zuerst nach ::1 auflösen.
    # Hinter einem Reverse Proxy gezielt nur lokal binden:
    #   BIND_ADDR=127.0.0.1 docker compose up -d
    ports:
      - "${BIND_ADDR:+${BIND_ADDR}:}7000:3000"

    restart: unless-stopped

    # Kein `init: true`. Es wuerde /sbin/docker-init in den Container mounten,
    # was auf gehaerteten Hosts an "operation not permitted" scheitern kann.
    # Gebraucht wird es hier ohnehin nicht: der Server behandelt SIGTERM und
    # SIGINT selbst (siehe server/server.js) und startet keine Kindprozesse,
    # die abgeraeumt werden muessten.

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      TZ: Europe/Berlin

      # Absolute Basis fuer Links in Sitemap, Landingpages und
      # Bestaetigungsmails. Ohne die echte Domain zeigen geteilte Links und
      # der Bestaetigungslink ins Leere.
      SITE_URL: ${SITE_URL:-http://localhost:7000}

      # Hinter einem Reverse Proxy setzen, damit die Ratenbegrenzung die
      # tatsaechliche Client-IP sieht statt der des Proxys. Nur setzen, wenn
      # wirklich ein vertrauenswuerdiger Proxy davorsteht - sonst kann sich
      # jeder Client seine IP selbst aussuchen.
      TRUST_PROXY: ${TRUST_PROXY:-}

      # Zugang zur Auswertung unter /admin?token=... Ohne Token ist die Seite
      # abgeschaltet und antwortet wie eine unbekannte Adresse.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}

      # Webhook eines Maildienstes fuer den Bestaetigungslink. Ohne diese
      # Angabe landet die Nachricht nur im Log.
      MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
      MAIL_WEBHOOK_TOKEN: ${MAIL_WEBHOOK_TOKEN:-}

      DATA_DIR: /data

    # Anfragen und Messwerte muessen einen Neustart ueberleben - sie sind der
    # einzige Teil des Systems, der sich nicht neu berechnen laesst.
    volumes:
      - ev-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # Zusatzhärtung (read_only, cap_drop, no-new-privileges) ist bewusst nicht
    # aktiv: sie hat auf einem gehärteten Ubuntu-Host den Containerstart
    # verhindert. Für den Betrieb wird sie nicht gebraucht - die Anwendung
    # läuft als unprivilegierter Nutzer, schreibt nichts und hält keine Daten.
    # Wer sie einschalten will, prüft die Optionen einzeln, siehe README.

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ev-data:
