name: Deploy

on:
  push:
    # Der Standardbranch des Repositories heisst noch nicht main. Beide Namen
    # stehen hier, damit der Deploy auch nach einer Umbenennung greift.
    branches: [main, claude/e-auto-calculator-wa2cmt]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.marke.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: marke
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/web:${{ steps.marke.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ausliefern:
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - name: Auf dem Server tauschen
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ampmatch
            sed -i "s/^TAG=.*/TAG=${{ needs.bauen.outputs.tag }}/" .env
            ./deploy.sh
